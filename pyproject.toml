[project]
name = "exam-practice"
version = "0.1.0"
description = "Crawl FuOverflow exam threads and practice them: majority-voted answers, per-exam folders, static quiz UI."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pycookiecheat>=0.8.0",
    "pillow>=12.3.0",
    "vercel>=0.11.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
exam-practice = "exam_practice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exam_practice"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
